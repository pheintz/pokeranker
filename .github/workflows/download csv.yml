name: Download PvPoke CSV

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download rankings CSVs and gamemaster JSON
        working-directory: process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node download-csv.js

      - name: Validate mandatory files
        run: |
          echo "=== Rankings (all downloaded) ==="
          ls -lh wwwroot/csv/*.csv 2>/dev/null || echo "(none)"

          echo ""
          echo "=== Mandatory Great League ranking ==="
          # 1500-only mode: Pokeranker is a Great League / 1500 CP analyzer.
          # We dropped Ultra (2500), Master (10000), and Little (500) support.
          # Restricted 1500-CP cups (Fantasy, Spellcraft, Catch, etc.) are
          # downloaded too but only cp1500_all is hard-required — losing a
          # restricted-cup CSV is a soft failure (the cup just won't appear
          # in the dropdown until next run).
          for f in cp1500_all_overall_rankings.csv; do
            if [ ! -f "wwwroot/csv/$f" ]; then
              echo "ERROR: Missing required file: wwwroot/csv/$f"
              exit 1
            fi
            lines=$(wc -l < "wwwroot/csv/$f")
            echo "$f: $lines lines"
            if [ "$lines" -lt 10 ]; then
              echo "ERROR: $f looks too short — download may have failed"
              exit 1
            fi
          done

          # Soft-warn on missing restricted-cup CSVs (don't fail the build).
          # PvPoke occasionally rotates cups out of season; if a cup is gone
          # we just skip it rather than blocking data updates for the rest.
          echo ""
          echo "=== Restricted 1500-CP cups (soft) ==="
          count_1500=$(ls wwwroot/csv/cp1500_*_overall_rankings.csv 2>/dev/null | wc -l)
          echo "Found $count_1500 cp1500 rankings CSVs."
          if [ "$count_1500" -lt 5 ]; then
            echo "WARN: only $count_1500 cp1500 cups present — PvPoke may have rotated formats."
          fi

          echo ""
          echo "=== index.json ==="
          if [ ! -f "wwwroot/csv/index.json" ]; then
            echo "ERROR: Missing wwwroot/csv/index.json"
            exit 1
          fi
          cat wwwroot/csv/index.json

          echo ""
          echo "=== Gamemaster ==="
          for f in moves.json pokemon.json; do
            if [ ! -f "wwwroot/data/$f" ]; then
              echo "ERROR: Missing expected file: wwwroot/data/$f"
              exit 1
            fi
            bytes=$(wc -c < "wwwroot/data/$f")
            echo "wwwroot/data/$f: $bytes bytes"
            if [ "$bytes" -lt 1000 ]; then
              echo "ERROR: $f looks too small ($bytes bytes) — download may have failed"
              exit 1
            fi
          done

      - name: Precompute meta-busting teams (cp1500_all + restricted cups)
        # Hoists the browser-side `runMetaBreaker` work into CI. The browser
        # loads `data/meta-teams-{leagueKey}.json` at runtime instead of
        # re-running 30-60s of battle sim per cup-view. Soft failure: if a
        # cup's precompute fails (PvPoke rotated formats, missing species),
        # the browser falls back to live compute for that one cup.
        #
        # Cost: ~5min per cup × ~17 cups ≈ 90min total CPU. Within GitHub
        # Actions free tier (2000 min/month public, daily cron = 90/day = OK).
        # If this becomes a bottleneck, restrict to cp1500_all + 2-3 active
        # cups by passing a CLI arg per league.
        run: |
          node test/precompute-meta-teams.js \
            || echo "WARN precompute partial — browser will live-compute missing cups"

      - name: Validate precomputed artifacts
        run: |
          echo "=== Precomputed meta-teams JSONs ==="
          ls -lh wwwroot/data/meta-teams-*.json 2>/dev/null || echo "(none)"
          # cp1500_all is the headline; soft-warn if missing rather than fail
          if [ ! -f "wwwroot/data/meta-teams-cp1500_all.json" ]; then
            echo "WARN: meta-teams-cp1500_all.json missing — Open GL will live-compute in browser"
          fi

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wwwroot/csv/
          git add wwwroot/data/moves.json
          git add wwwroot/data/pokemon.json
          git add wwwroot/data/meta-teams-*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update PvPoke data [skip ci]"
          git push
